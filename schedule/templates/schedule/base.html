<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Расписание{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            color: #222;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #f0f0f0;
        }
        a {
            color: #0b57d0;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .nav {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        .nav a {
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .nav a.home-link {
            background-color: #0b57d0;
            color: white;
            font-weight: bold;
        }
        .nav a.home-link:hover {
            background-color: #0947a8;
            text-decoration: none;
        }
        .nav a.back-link {
            background-color: #6c757d;
            color: white;
            font-weight: bold;
        }
        .nav a.back-link:hover {
            background-color: #5a6268;
            text-decoration: none;
        }
        .nav a.back-link.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .card {
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
        }
        .muted {
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="{% url 'schedule:home' %}" class="home-link">Главная</a>
            <a href="#" class="back-link" id="backBtn" onclick="history.back(); return false;">← Назад</a>
        </div>

        {% block content %}{% endblock %}
    </div>

    <script>
        // Проверяем, есть ли история переходов
        if (window.history.length <= 1) {
            // Если истории нет — делаем кнопку неактивной
            var backBtn = document.getElementById('backBtn');
            backBtn.classList.add('disabled');
            backBtn.onclick = function(e) { e.preventDefault(); };
        }
    </script>
</body>
</html>
