{% extends 'schedule/base.html' %}

{% block title %}Копирование расписания{% endblock %}

{% block content %}
<h1>Копирование расписания</h1>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="post" class="card">
    {% csrf_token %}

    <div class="form-group">
        <label for="source_group">Группа-источник:</label>
        <select name="source_group" id="source_group" required>
            <option value="">-- Выберите группу --</option>
            {% for group in all_groups %}
                <option value="{{ group.id }}">{{ group.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="target_group">Группа-назначение:</label>
        <select name="target_group" id="target_group" required>
            <option value="">-- Выберите группу --</option>
            {% for group in all_groups %}
                <option value="{{ group.id }}">{{ group.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="source_week_start">Дата начала (опционально):</label>
        <input type="date" name="source_week_start" id="source_week_start">
    </div>

    <div class="form-group">
        <label for="source_week_end">Дата окончания (опционально):</label>
        <input type="date" name="source_week_end" id="source_week_end">
    </div>

    <button type="submit" class="btn-copy">Скопировать расписание</button>
</form>

<style>
.copy-form {
    background-color: #f8f9fa;
    padding: 30px;
    border-radius: 8px;
    max-width: 600px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #2c3e50;
}

.form-group select,
.form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
}

.btn-copy {
    padding: 12px 30px;
    background-color: #27ae60;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
}

.btn-copy:hover {
    background-color: #229954;
}

.alert {
    padding: 15px;
    border-radius: 4px;
    margin-bottom: 20px;
}

.alert-success {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}

.alert-error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
</style>
{% endblock %}
